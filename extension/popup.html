<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PhishGuard Extension</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .verdict { font-size: 16px; font-weight: 700; }
      .meta { font-size: 11px; color: #475569; font-family: ui-monospace, monospace; }
      .list { margin: 10px 0; font-size: 12px; }
      .item {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #e2e8f0;
      }
      .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
      button {
        cursor: pointer;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0f172a;
      }
      button.primary { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    </style>
  </head>
  <body>
    <div class="header">
      <div id="verdict" class="verdict">Checking...</div>
      <div id="latency" class="meta">0.00 ms</div>
    </div>
    <div id="host" class="meta" style="margin-bottom:8px;"></div>
    <div id="bloom" class="meta" style="margin-bottom:10px;"></div>

    <div style="font-size:12px;font-weight:600;">Why Flagged (coef &times; val)</div>
    <div id="why-list" class="list"></div>

    <div class="actions">
      <button id="mark-safe" class="primary">Mark as Safe / Report False Positive</button>
      <button id="export-json">Export False Positives JSON</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
