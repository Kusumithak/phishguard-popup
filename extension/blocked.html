<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked: Phishing Threat Detected — PhishGuard</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #fef2f2;
        color: #0f172a;
        padding: 32px 16px;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #fecaca;
        border-radius: 12px;
        padding: 28px;
      }
      .kicker {
        font-size: 12px;
        font-weight: 700;
        color: #b91c1c;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 { margin: 8px 0 12px; font-size: 24px; }
      .url-box {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
        word-break: break-all;
        margin-bottom: 18px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: 12px;
      }
      th, td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid #e2e8f0;
      }
      th { color: #475569; font-weight: 600; }
      .num { font-family: ui-monospace, monospace; text-align: right; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }
      button {
        cursor: pointer;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
      }
      .primary { background: #0f172a; color: #ffffff; border: none; }
      .secondary { background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; }
      .status { margin-top: 14px; font-size: 13px; color: #15803d; font-weight: 500; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="kicker">PhishGuard Protection · Navigation Blocked</div>
      <h1>Phishing Threat Detected</h1>
      <p>This page was blocked because its combined URL, rule, and DOM risk score exceeded the calibrated phishing threshold.</p>

      <div id="blocked-url" class="url-box"></div>
      <div id="meta-line" style="font-size:13px;color:#475569;margin-bottom:14px;"></div>

      <h2 style="font-size:15px;margin:16px 0 6px;">Why Flagged (Coefficient &times; Value)</h2>
      <table>
        <thead>
          <tr>
            <th>Signal</th>
            <th>Layer</th>
            <th class="num">Coef</th>
            <th class="num">Value</th>
            <th class="num">Impact</th>
          </tr>
        </thead>
        <tbody id="why-rows"></tbody>
      </table>

      <div class="actions">
        <button id="go-back-btn" class="primary">Go Back to Safety</button>
        <button id="mark-safe-btn" class="secondary">Mark as Safe / Report False Positive</button>
        <button id="export-json-btn" class="secondary">Export False Positives JSON</button>
      </div>
      <div id="status-msg" class="status"></div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
